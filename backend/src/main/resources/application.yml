spring:
  application:
    name: vetcare
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vetcare}
    username: ${DB_USER:vetcare}
    password: ${DB_PASSWORD:vetcare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:vetcare-dev-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed:
    enabled: ${APP_SEED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
