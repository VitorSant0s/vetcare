spring:
  datasource:
    url: jdbc:h2:mem:vetcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: none

app:
  jwt:
    secret: vetcare-test-secret-0123456789abcdef0123456789abcdef
    expiration-minutes: 60
  seed:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
